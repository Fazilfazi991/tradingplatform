name: staged release

on:
  workflow_dispatch:
    inputs:
      rollback_deployment_id:
        description: Previous healthy production deployment ID or URL
        required: true
        type: string
      rollback_rehearsed:
        description: Confirm rollback to the supplied deployment was rehearsed successfully
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  authorize-staging:
    name: Verify hosted quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ROLLBACK_DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
      ROLLBACK_REHEARSED: ${{ inputs.rollback_rehearsed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Require main and successful quality checks for this commit
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${ROLLBACK_REHEARSED}" = "true" || {
            echo "A successful rollback rehearsal must be attested before staging." >&2
            exit 1
          }
          test -n "${ROLLBACK_DEPLOYMENT_ID}" || {
            echo "A previous healthy rollback deployment ID is required." >&2
            exit 1
          }
          [[ "${ROLLBACK_DEPLOYMENT_ID}" =~ ^(https://[A-Za-z0-9.-]+\.vercel\.app|dpl_[A-Za-z0-9]+)$ ]] || {
            echo "Rollback target must be a Vercel deployment URL or deployment ID." >&2
            exit 1
          }
          for check in backend web repository-safety; do
            conclusions="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq "[.check_runs[] | select(.name == \"${check}\")] | sort_by(.started_at) | last | .conclusion")"
            echo "${conclusions}" | grep -qx "success" || {
              echo "Latest required hosted check is not successful: ${check}" >&2
              exit 1
            }
          done
          python scripts/audit_release_gates.py

  stage-production-build:
    name: Stage immutable production build
    needs: authorize-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-staging
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERIFIED_EDGE_CANONICAL_URL: ${{ vars.VERIFIED_EDGE_CANONICAL_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.VERIFIED_EDGE_CANONICAL_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Require complete release environment
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN}"
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"
          test -n "${VERCEL_AUTOMATION_BYPASS_SECRET}"
          test -n "${VERIFIED_EDGE_CANONICAL_URL}"
          test "${NEXT_PUBLIC_SITE_URL}" = "${VERIFIED_EDGE_CANONICAL_URL}"
          case "${NEXT_PUBLIC_SITE_URL}" in
            https://*) ;;
            *) echo "Canonical site URL must be HTTPS" >&2; exit 1 ;;
          esac
      - run: pnpm install --frozen-lockfile
      - name: Pull production project settings
        run: pnpm exec vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
      - name: Validate pulled public-web environment without disclosing values
        shell: bash
        run: |
          release_env="${RUNNER_TEMP}/verified-edge-release.env"
          trap 'rm -f "${release_env}"' EXIT
          pnpm exec vercel env pull "${release_env}" --yes --environment=production --token="${VERCEL_TOKEN}"
          python scripts/verify_release_environment.py --profile public-web --stage production --dotenv-file "${release_env}"
      - name: Build production artifact
        run: pnpm exec vercel build --prod --token="${VERCEL_TOKEN}"
      - name: Deploy without assigning production domains
        id: deploy
        shell: bash
        run: |
          deployment_url="$(pnpm exec vercel deploy --prebuilt --prod --skip-domain --yes --token="${VERCEL_TOKEN}")"
          case "${deployment_url}" in
            https://*.vercel.app) ;;
            *) echo "Vercel returned an invalid deployment URL" >&2; exit 1 ;;
          esac
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "### Staged deployment" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Commit: ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- URL: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Smoke staged deployment
        run: pnpm --dir apps/web deployment:smoke -- "${{ steps.deploy.outputs.url }}" "${VERIFIED_EDGE_CANONICAL_URL}"

  authorize-production:
    name: Authorize Track A promotion
    needs: stage-production-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Fail closed unless every Track A gate passes
        run: python scripts/audit_release_gates.py --require-track public_platform

  promote-production:
    name: Promote exact staged deployment
    needs: [stage-production-build, authorize-production]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERIFIED_EDGE_CANONICAL_URL: ${{ vars.VERIFIED_EDGE_CANONICAL_URL }}
      STAGED_DEPLOYMENT_URL: ${{ needs.stage-production-build.outputs.deployment_url }}
      ROLLBACK_DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Require production configuration
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN}"
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"
          test -n "${VERIFIED_EDGE_CANONICAL_URL}"
          case "${STAGED_DEPLOYMENT_URL}" in
            https://*.vercel.app) ;;
            *) echo "Staged deployment URL is invalid" >&2; exit 1 ;;
          esac
          test "${ROLLBACK_DEPLOYMENT_ID}" != "${STAGED_DEPLOYMENT_URL}" || {
            echo "Rollback target must differ from the staged deployment." >&2
            exit 1
          }
      - name: Promote without rebuilding
        run: pnpm exec vercel promote "${STAGED_DEPLOYMENT_URL}" --yes --token="${VERCEL_TOKEN}"
      - name: Smoke canonical production deployment
        id: production_smoke
        continue-on-error: true
        run: pnpm --dir apps/web deployment:smoke -- "${VERIFIED_EDGE_CANONICAL_URL}" "${VERIFIED_EDGE_CANONICAL_URL}"
      - name: Verify production browser console and network
        id: production_browser_smoke
        continue-on-error: true
        env:
          VISUAL_QA_BASE_URL: ${{ vars.VERIFIED_EDGE_CANONICAL_URL }}
        run: pnpm visual:web
      - name: Seal and validate production deployment evidence
        id: deployment_evidence
        if: steps.production_smoke.outcome == 'success' && steps.production_browser_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          evidence_file="${RUNNER_TEMP}/deployment-evidence.json"
          python -m scripts.create_deployment_evidence \
            --environment production \
            --deployment-id "${STAGED_DEPLOYMENT_URL}" \
            --rollback-deployment-id "${ROLLBACK_DEPLOYMENT_ID}" \
            --commit-sha "${GITHUB_SHA}" \
            --url "${VERIFIED_EDGE_CANONICAL_URL}" \
            --operator "${GITHUB_ACTOR}" \
            --output "${evidence_file}"
          python scripts/validate_deployment_evidence.py --file "${evidence_file}"
      - name: Upload sealed deployment evidence
        id: upload_evidence
        if: steps.deployment_evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Roll back failed production release
        if: always() && (steps.production_smoke.outcome == 'failure' || steps.production_browser_smoke.outcome == 'failure' || steps.deployment_evidence.outcome == 'failure' || steps.upload_evidence.outcome == 'failure')
        shell: bash
        run: |
          pnpm exec vercel rollback "${ROLLBACK_DEPLOYMENT_ID}" --yes --timeout=3m --token="${VERCEL_TOKEN}"
          pnpm exec vercel rollback status --timeout=3m --token="${VERCEL_TOKEN}"
      - name: Fail release after rollback attempt
        if: always() && (steps.production_smoke.outcome == 'failure' || steps.production_browser_smoke.outcome == 'failure' || steps.deployment_evidence.outcome == 'failure' || steps.upload_evidence.outcome == 'failure')
        run: |
          echo "Production verification or evidence retention failed; rollback was attempted and the release is rejected." >&2
          exit 1
      - name: Record immutable release identity
        shell: bash
        run: |
          echo "### Production promotion" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Commit: ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Staged deployment: ${STAGED_DEPLOYMENT_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Canonical URL: ${VERIFIED_EDGE_CANONICAL_URL}" >> "${GITHUB_STEP_SUMMARY}"
